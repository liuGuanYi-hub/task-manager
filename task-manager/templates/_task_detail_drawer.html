<div class="today-drawer-layer" id="today-drawer-layer" hidden>
    <div class="today-drawer-backdrop" data-today-drawer-close></div>
    <aside class="today-detail-drawer" id="today-detail-drawer" role="dialog" aria-modal="true" aria-labelledby="today-detail-title" tabindex="-1">
        <header class="today-detail-header">
            <div><span class="eyebrow">TASK DETAIL</span><span class="today-detail-preview-label">实时详情</span></div>
            <button type="button" class="today-detail-close" data-today-drawer-close aria-label="关闭任务详情">×</button>
        </header>
        <div class="today-detail-body">
            <div class="today-detail-title-block">
                <span class="today-detail-status" id="today-detail-status">待办</span>
                <h2 id="today-detail-title">任务标题</h2>
                <p id="today-detail-context">Today 工作台</p>
            </div>
            <div class="today-detail-property-grid" aria-label="任务属性">
                <div><span>优先级</span><strong id="today-detail-priority">中优先级</strong></div>
                <div><span>截止时间</span><strong id="today-detail-meta">暂无截止日期</strong></div>
                <div><span>项目</span><strong id="today-detail-project">未归属项目</strong></div>
                <div><span>标签</span><strong id="today-detail-tag">未分类</strong></div>
            </div>
            <section class="today-detail-section">
                <div class="today-detail-section-heading"><h3>描述</h3><span>DESCRIPTIONS</span></div>
                <p class="today-detail-placeholder" id="today-detail-description">暂无描述</p>
            </section>
            <section class="today-detail-section today-detail-edit-section">
                <div class="today-detail-section-heading"><h3>快速编辑</h3><span>EDIT</span></div>
                <form id="today-detail-form" method="post" action="#" class="today-detail-form">
                    <div class="today-detail-edit-grid">
                        <label class="today-detail-edit-field today-detail-edit-field-wide">
                            <span>标题</span>
                            <input id="today-detail-title-input" name="title" type="text" required>
                        </label>
                        <label class="today-detail-edit-field">
                            <span>优先级</span>
                            <select id="today-detail-priority-input" name="priority">
                                <option value="低">低</option>
                                <option value="中">中</option>
                                <option value="高">高</option>
                            </select>
                        </label>
                        <label class="today-detail-edit-field">
                            <span>状态</span>
                            <select id="today-detail-status-input" name="status">
                                <option value="待办">待办</option>
                                <option value="进行中">进行中</option>
                                <option value="已完成">已完成</option>
                            </select>
                        </label>
                        <label class="today-detail-edit-field">
                            <span>截止时间</span>
                            <input id="today-detail-due-date-input" name="due_date" type="datetime-local">
                        </label>
                        <label class="today-detail-edit-field">
                            <span>所属项目</span>
                            <select id="today-detail-project-input" name="project_id">
                                <option value="">无项目</option>
                                {% for project in projects %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </label>
                        <label class="today-detail-edit-field today-detail-edit-field-wide">
                            <span>标签</span>
                            <input id="today-detail-tags-input" name="tags" type="text" placeholder="用逗号分隔">
                        </label>
                        <label class="today-detail-edit-field today-detail-edit-field-wide">
                            <span>描述</span>
                            <textarea id="today-detail-description-input" name="description" rows="4"></textarea>
                        </label>
                    </div>
                </form>
            </section>
            <section class="today-detail-section">
                <div class="today-detail-section-heading"><h3>子任务</h3><span>0 / 2</span></div>
                <div class="today-detail-subtask-placeholder"><span>＋</span><span>添加子任务</span><em>即将接入</em></div>
                <div class="today-detail-subtask-placeholder"><span>○</span><span>拆分下一步行动</span><em>预览</em></div>
            </section>
            <section class="today-detail-section">
                <div class="today-detail-section-heading"><h3>操作历史</h3><span>ACTIVITY</span></div>
                <div class="today-detail-activity"><span class="today-detail-activity-dot"></span><div><strong>任务已加载到当前工作台</strong><small id="today-detail-updated">暂无更新时间</small></div></div>
            </section>
        </div>
        <footer class="today-detail-footer">
            <div class="today-detail-actions" aria-label="任务快速操作">
                <button type="button" class="btn btn-success" data-task-action="complete">完成</button>
                <button type="button" class="btn" data-task-action="delay">明天</button>
                <button type="button" class="btn btn-danger" data-task-action="archive">归档</button>
            </div>
            <div class="today-detail-footer-links">
                <button type="submit" form="today-detail-form" class="btn btn-primary">保存更改</button>
                <a id="today-detail-edit-link" class="btn btn-warning" href="#">完整编辑页</a>
            </div>
            <span id="today-detail-action-feedback" role="status" aria-live="polite">保存后返回当前工作台</span>
        </footer>
    </aside>
</div>
